<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wikimedia Commons — Media Statistics Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #58a6ff;
      --muted: #8b949e;
      --text: #e6edf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    a { color: var(--accent); }
    .container { max-width: 1200px; margin: auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { margin: 0; font-size: 1.6rem; color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 1rem; }
    .kpi {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      min-width: 0;
    }
    .kpi-label { color: var(--muted); font-size: 0.9rem; }
    .kpi-value { font-size: 1.4rem; font-weight: bold; color: var(--accent); overflow-wrap: anywhere; }
    .filters { text-align: center; margin: 1.2rem 0; }
    button.filter {
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 6px 14px;
      margin: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.filter:hover { background: #1f2a37; }
    button.filter.active { background: var(--accent); color: #0d1117; font-weight: 600; }
    button.filter:disabled { opacity: 0.4; cursor: default; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chart-box {
      background: var(--card);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      min-width: 0;
    }
    .error { background: #3d1418; border: 1px solid #f85149; color: #ffdcd7; padding: 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 6px; text-align: left; }
    th { color: var(--muted); position: sticky; top: 0; background: var(--card); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      body { padding: 12px; }
      h1 { font-size: 1.25rem; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { padding: 10px; }
      .kpi-value { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Wikimedia Commons — Media Statistics Dashboard</h1>
      <p class="subtitle">Data fetched daily from <a href="https://commons.wikimedia.org/wiki/Special:MediaStatistics" target="_blank" rel="noopener">Special:MediaStatistics</a><span id="updated"></span> · <a href="history.html">▶ Play history</a></p>
    </header>

    <div id="error" class="error" role="alert"></div>

    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Total Files</div><div id="kpi-files" class="kpi-value">—</div></div>
      <div class="kpi"><div class="kpi-label">Total Size</div><div id="kpi-size" class="kpi-value">—</div></div>
      <div class="kpi"><div class="kpi-label">Top by Count</div><div id="kpi-top-count" class="kpi-value">—</div></div>
      <div class="kpi"><div class="kpi-label">Top by Size</div><div id="kpi-top-size" class="kpi-value">—</div></div>
    </div>

    <div class="filters">
      <button class="filter active" data-group="all">All</button>
      <button class="filter" data-group="images">Images</button>
      <button class="filter" data-group="audio">Audio</button>
      <button class="filter" data-group="video">Video</button>
      <button class="filter" data-group="documents">Office</button>
      <button class="filter" data-group="3d">3D</button>
    </div>

    <div class="grid">
      <div class="chart-box"><div id="pie-chart"></div></div>
      <div class="chart-box"><div id="bar-chart"></div></div>
    </div>
    <div class="chart-box" style="margin-top:12px;"><div id="top10-chart"></div></div>

    <div class="chart-box" style="margin-top:12px;overflow:auto;max-height:450px;">
      <table id="data-table">
        <thead><tr>
          <th>MIME type</th><th>Section</th><th>Extensions</th>
          <th class="num">Files</th><th class="num">% of files</th>
          <th class="num">Size</th><th class="num">% of size</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
  // Which Special:MediaStatistics sections belong to each filter button.
  const GROUPS = {
    all: null,
    images: ['bitmap', 'drawing'],
    audio: ['audio'],
    video: ['video', 'multimedia'],
    documents: ['office', 'text'],
    '3d': ['3d'],
  };
  const SECTION_LABELS = {
    bitmap: 'Bitmap images', drawing: 'Drawings', audio: 'Audio', video: 'Videos',
    multimedia: 'Multimedia', office: 'Office', text: 'Text', '3d': '3D', unknown: 'Other',
  };

  // Older data files have no "category"; infer one so the page still works.
  function guessCategory(d, index, all) {
    if (d.category) return d.category;
    const m = d.mime;
    if (m === 'image/svg+xml') return 'drawing';
    if (m === 'image/vnd.djvu') {
      const djvus = all.filter(x => x.mime === m);
      return (djvus.length > 1 && djvus[0] === d) ? 'bitmap' : 'office';
    }
    if (m === 'application/ogg') {
      const oggs = all.filter(x => x.mime === m);
      return (oggs.length > 1 && oggs[0] === d) ? 'audio' : 'video';
    }
    if (m.startsWith('image/')) return 'bitmap';
    if (m.startsWith('audio/')) return 'audio';
    if (m.startsWith('video/')) return 'video';
    if (m === 'application/pdf') return 'office';
    if (m.includes('sla') || m.includes('stl')) return '3d';
    return 'unknown';
  }

  const fmtInt = n => n.toLocaleString('en-US');
  function fmtBytes(b) {
    const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
    let i = 0;
    while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
    return `${b.toLocaleString('en-US', { maximumFractionDigits: b < 10 ? 2 : 1 })} ${units[i]}`;
  }
  function fmtPct(p) {
    if (p === 0) return '0%';
    if (p < 0.01) return '<0.01%';
    return p.toLocaleString('en-US', { maximumFractionDigits: 2 }) + '%';
  }
  const bytesToTiB = b => b / 1024 ** 4;

  const LAYOUT = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { color: '#e6edf3' },
    xaxis: { gridcolor: 'rgba(255,255,255,0.08)', automargin: true },
    yaxis: { gridcolor: 'rgba(255,255,255,0.08)', automargin: true },
  };
  const CONFIG = { responsive: true, displaylogo: false };

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function loadData() {
    const res = await fetch('data/media_stats.json?_=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status} loading data/media_stats.json`);
    return res.json();
  }

  // cdn.plot.ly is blocked or rewritten on some networks; fall back to jsDelivr.
  const PLOTLY_FALLBACK = 'https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.29.1/plotly.min.js';
  function ensurePlotly() {
    if (typeof Plotly !== 'undefined') return Promise.resolve();
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = PLOTLY_FALLBACK;
      s.onload = s.onerror = () => resolve();
      document.head.appendChild(s);
    });
  }

  Promise.all([loadData(), ensurePlotly()]).then(([json]) => {
    const raw = json.entries || [];
    if (!raw.length) throw new Error('The data file contains no entries.');

    const DATA = raw.map((d, i, all) => {
      const category = guessCategory(d, i, all);
      return { ...d, category, section: SECTION_LABELS[category] || d.category_label || category };
    });
    // Some MIME types appear in more than one section (e.g. application/ogg under
    // Audio and Videos); give them unique labels so charts don't merge/overlap them.
    const counts = {};
    DATA.forEach(d => counts[d.mime] = (counts[d.mime] || 0) + 1);
    DATA.forEach(d => d.label = counts[d.mime] > 1 ? `${d.mime} (${d.section})` : d.mime);

    const allFiles = DATA.reduce((s, d) => s + d.files, 0);
    const allBytes = DATA.reduce((s, d) => s + d.size_bytes, 0);
    const totalFiles = (json.totals && json.totals.files) || allFiles;
    const totalBytes = (json.totals && json.totals.size_bytes) || allBytes;

    if (json.updated) {
      const dt = new Date(json.updated);
      document.getElementById('updated').textContent =
        ` · last updated ${dt.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`;
    }

    function filterRows(group) {
      const cats = GROUPS[group];
      return cats ? DATA.filter(d => cats.includes(d.category)) : DATA.slice();
    }

    // Disable filter buttons that would show nothing.
    document.querySelectorAll('.filter').forEach(btn => {
      if (!filterRows(btn.dataset.group).length) btn.disabled = true;
    });

    function render(group) {
      const rows = filterRows(group).sort((a, b) => b.size_bytes - a.size_bytes);
      const files = rows.reduce((s, d) => s + d.files, 0);
      const bytes = rows.reduce((s, d) => s + d.size_bytes, 0);

      document.getElementById('kpi-files').textContent = fmtInt(files);
      document.getElementById('kpi-size').textContent = fmtBytes(bytes);
      const topByCount = rows.slice().sort((a, b) => b.files - a.files)[0];
      document.getElementById('kpi-top-count').textContent = topByCount ? topByCount.label : '—';
      document.getElementById('kpi-top-size').textContent = rows[0] ? rows[0].label : '—';

      renderTable(rows);
      if (typeof Plotly === 'undefined') {
        showError('The charting library (Plotly) failed to load; showing the table only.');
        ['pie-chart', 'bar-chart', 'top10-chart'].forEach(id =>
          document.getElementById(id).parentElement.style.display = 'none');
        return;
      }
      renderCharts(rows);
    }

    function renderCharts(rows) {
      Plotly.react('pie-chart', [{
        labels: rows.map(r => r.label),
        values: rows.map(r => r.files),
        type: 'pie',
        hole: 0.35,
        sort: true,
        textinfo: 'percent',
        textposition: 'inside',
        insidetextorientation: 'horizontal',
        hovertemplate: '%{label}<br>%{value:,} files (%{percent})<extra></extra>',
      }], {
        ...LAYOUT,
        title: 'File Count Distribution',
        uniformtext: { minsize: 10, mode: 'hide' },
        legend: { font: { size: 10 } },
        showlegend: window.innerWidth > 600,
        height: window.innerWidth > 600 ? 450 : 340,
        margin: { t: 50, b: 20, l: 10, r: 10 },
      }, CONFIG);

      Plotly.react('bar-chart', [{
        x: rows.map(r => r.label),
        y: rows.map(r => bytesToTiB(r.size_bytes)),
        customdata: rows.map(r => fmtBytes(r.size_bytes)),
        type: 'bar',
        marker: { color: '#58a6ff' },
        hovertemplate: '%{x}<br>%{customdata}<extra></extra>',
      }], {
        ...LAYOUT,
        title: 'Total Size by MIME Type (TiB, log scale)',
        xaxis: { ...LAYOUT.xaxis, tickangle: -45 },
        yaxis: { ...LAYOUT.yaxis, type: 'log', title: 'TiB', exponentformat: 'power' },
        height: 450,
        margin: { t: 50, b: 40 },
      }, CONFIG);

      // Average file size highlights what the totals hide (e.g. TIFF/PDF vs JPEG).
      const avg = rows.filter(r => r.files > 0)
        .map(r => ({ ...r, avg: r.size_bytes / r.files }))
        .sort((a, b) => b.avg - a.avg).slice(0, 10);
      Plotly.react('top10-chart', [{
        x: avg.map(r => r.label),
        y: avg.map(r => r.avg / 1024 ** 2),
        customdata: avg.map(r => fmtBytes(r.avg)),
        type: 'bar', marker: { color: '#00b8a9' },
        hovertemplate: '%{x}<br>%{customdata} per file<extra></extra>',
      }], {
        ...LAYOUT,
        title: 'Top 10 MIME Types by Average File Size (MiB)',
        xaxis: { ...LAYOUT.xaxis, tickangle: -45 },
        yaxis: { ...LAYOUT.yaxis, title: 'MiB per file' },
        margin: { t: 50, b: 40 },
      }, CONFIG);
    }

    function renderTable(rows) {
      const tbody = document.querySelector('#data-table tbody');
      tbody.replaceChildren();
      rows.forEach(d => {
        const tr = document.createElement('tr');
        const cells = [
          [d.mime], [d.section], [d.ext],
          [fmtInt(d.files), 'num'],
          [fmtPct(d.percent ?? d.files / totalFiles * 100), 'num'],
          [fmtBytes(d.size_bytes), 'num'],
          [fmtPct(d.size_percent || d.size_bytes / totalBytes * 100), 'num'],
        ];
        cells.forEach(([text, cls]) => {
          const td = document.createElement('td');
          td.textContent = text;
          if (cls) td.className = cls;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    document.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.group);
      });
    });

    render('all');
  }).catch(err => {
    console.error(err);
    showError('Could not load media statistics: ' + err.message);
  });
  </script>
</body>
</html>
